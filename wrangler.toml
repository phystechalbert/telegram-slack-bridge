name = "telegram-slack-bridge"
main = "src/index.mjs"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
keep_vars = true
workers_dev = true
preview_urls = false

[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true
